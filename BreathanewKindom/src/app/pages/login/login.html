<main>
    <div class="login-cont">
        <div class="formulario-cont">
            <div class="formulario-cabeza">
                <div class="titulo_cabeza">
                    <h2 id="titulo">Iniciar Sesión</h2>
                </div>
                <div class="inputs-cont">
                    <div>
                        <h3 id="usuario-h3">Usuario</h3>
                        <input id="usuario-input" type="text" title="Usuario" [(ngModel)]="usuario" name="usuario" />
                    </div>
                    <div>
                        <h3 id="contra-h3">Contraseña</h3>
                        <input type="password" title="Contraseña" id="contra" [(ngModel)]="contrasena"
                            name="contraseña" />
                    </div>
                </div>
            </div>
            <div class="formulario-pie">
                <div id="redireccionar-registro">
                    <a routerLink="/register" id="no-cuenta">
                        <span>¿No tienes cuenta aún?</span>
                        <span> Regístrate aquí</span>
                    </a>
                </div>
                <div class="btn-cont">
                    <button class="iniciar-sesion" (click)="onLogin()">Iniciar Sesión</button>
                </div>
            </div>
        </div>
    </div>
    <div class="img_cont">
        <div id="filtro"></div>
        <div class="titulo">
            <h2 id="restaurant">RESTAURANT</h2>
            <h1 id="nombre-empresa">Breath <br>of a <br>New <br>Kingdom</h1>
            <h3 id="eslogan">Saborea los paltillos dignos de un rey</h3>
            <div class="info">
                <h4>Encuéntranos en Andrés Pérez de Riva #410 también puedes pedir a domicilio llamando al 6871558515
                </h4>
            </div>
        </div>
    </div>

</main>
